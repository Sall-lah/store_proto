syntax = "proto3";

package store.user.v1;

import "store/user/v1/user_profile.proto";

option go_package = "github.com/Sall-lah/store_proto/gen/go/store/user/v1;userv1";

// UserService provides synchronous gRPC endpoints for user profile lifecycle management.
// Used by store_auth to provision user profiles immediately upon OTP verification.
service UserService {
  // CreateUserProfile initializes a new user profile record and default preferences
  // immediately after successful OTP verification in store_auth.
  // This operation is idempotent: if a profile already exists for the user_id,
  // it returns the existing profile with is_created = false and status OK.
  rpc CreateUserProfile (CreateUserProfileRequest) returns (CreateUserProfileResponse);
}

// CreateUserProfileRequest carries the minimum identity data required to provision a profile.
message CreateUserProfileRequest {
  // Unique auth user identifier (UUID) generated by store_auth.
  string user_id = 1;

  // Full name of the user supplied during registration.
  string full_name = 2;

  // Registered email address.
  string email = 3;

  // Optional phone number if captured during signup.
  optional string phone_number = 4;

  // Optional initial avatar URL.
  optional string avatar_url = 5;
}

// CreateUserProfileResponse returns the provisioned profile and creation status metadata.
message CreateUserProfileResponse {
  // The created or existing user profile entity.
  UserProfile profile = 1;

  // True if a new profile record was created, false if it already existed (idempotent replay).
  bool is_created = 2;

  // Operational status message explaining the outcome (e.g. "User profile created successfully").
  string message = 3;
}
